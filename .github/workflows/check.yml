name: Check external DNS mail
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - run: pnpm --dir mail-worker install --frozen-lockfile
      - run: node --experimental-vm-modules --test automation/test/external-*.test.mjs
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          pnpm --dir mail-worker install --frozen-lockfile
          pnpm --dir mail-vue install --frozen-lockfile
          pnpm --dir mail-vue run build
          node automation/external-check-bundle.mjs
