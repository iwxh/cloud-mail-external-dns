<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><title>Cloud Mail 中文图解教程，第 4 页，示例 kinghh.cn</title><rect x="0" y="0" width="800" height="1120" fill="#f3f6fa" stroke="none" stroke-width="1"/><rect x="48" y="32" width="75.1953125" height="26" rx="7" fill="#eaf1ff" stroke="none" stroke-width="1"/><text x="58" y="47.559999999999945" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#2159bb">准备 3 / 3</text><text x="48" y="106.39999999999998" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#172b46">填写 1 个变量和 4 个密钥</text><text x="48" y="139.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#5b6c81">仍在本客户的“环境”页面。变量名和密钥名必须保留原文，不要改成中文。</text><text x="48" y="183.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">中文对照示意 · 非真实截图 · 括号内为平台原文</text><rect x="48" y="198" width="704" height="264" rx="12" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><rect x="49" y="199" width="702" height="39" rx="11" fill="#e9eef5" stroke="none" stroke-width="1"/><circle cx="66" cy="218" r="4" fill="#e38383" stroke="none" stroke-width="1"/><circle cx="82" cy="218" r="4" fill="#d8af57" stroke="none" stroke-width="1"/><circle cx="98" cy="218" r="4" fill="#70ac8a" stroke="none" stroke-width="1"/><rect x="128" y="206" width="606" height="23" rx="5" fill="#ffffff" stroke="none" stroke-width="1"/><text x="139" y="218.79999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">github.com/iwxh/cloud-mail-external-dns</text><text x="70" y="270.72" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172b46">客户部署环境：external-kinghh.cn</text><text x="70" y="307.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#172b46">环境变量（Variables）</text><text x="70" y="338.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">名称（Name）</text><rect x="70" y="350" width="265" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="82" y="370.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" fill="#172b46">CUSTOMER_DOMAIN</text><text x="355" y="338.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">值（Value）</text><rect x="355" y="350" width="375" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="367" y="372.32000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">kinghh.cn</text><rect x="67" y="346" width="666" height="54" rx="7" fill="none" stroke="#2159bb" stroke-width="2"/><circle cx="730" cy="344" r="12.5" fill="#2159bb" stroke="none" stroke-width="2"/><text x="730" y="348.25" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.0" font-weight="700" fill="#ffffff">1</text><text x="70" y="443.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#2159bb">环境密钥 → 新增环境密钥（Add environment secret）</text><rect x="48" y="467" width="704" height="66" rx="0" fill="#e9eef5" stroke="none" stroke-width="1"/><text x="58" y="490.44000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#172b46">密钥名称</text><text x="348" y="490.44000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#172b46">值填写什么</text><line x1="48" y1="533" x2="752" y2="533" stroke="#dce4ed" stroke-width="1"/><rect x="48" y="533" width="704" height="66" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="58" y="556.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">CLOUDFLARE_ACCOUNT_ID</text><text x="348" y="556.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">共用 CF 账号的账号标识</text><line x1="48" y1="599" x2="752" y2="599" stroke="#dce4ed" stroke-width="1"/><rect x="48" y="599" width="704" height="66" rx="0" fill="#f8fafd" stroke="none" stroke-width="1"/><text x="58" y="622.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">CLOUDFLARE_API_TOKEN</text><text x="348" y="622.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">本仓库专用部署令牌；确认未过期</text><line x1="48" y1="665" x2="752" y2="665" stroke="#dce4ed" stroke-width="1"/><rect x="48" y="665" width="704" height="66" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="58" y="688.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">RESEND_API_KEY</text><text x="348" y="688.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">本客户的 Resend 完全访问密钥</text><line x1="48" y1="731" x2="752" y2="731" stroke="#dce4ed" stroke-width="1"/><rect x="48" y="731" width="704" height="66" rx="0" fill="#f8fafd" stroke="none" stroke-width="1"/><text x="58" y="754.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">MAIL_OWNER_EMAIL</text><text x="348" y="754.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">接收激活通知的现有 QQ / Gmail 等邮箱</text><line x1="48" y1="797" x2="752" y2="797" stroke="#dce4ed" stroke-width="1"/><text x="48" y="832.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">CF 部署令牌需要该账号的 Worker 程序、D1 数据库、KV 存储、Workers AI 编辑权限；本模式不需要 DNS 编辑</text><text x="48" y="855.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">或 CF 邮件路由权限。</text><rect x="48" y="905" width="704" height="120" rx="12" fill="#fff3e5" stroke="none" stroke-width="1"/><text x="68" y="933.2" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#a4540d">密钥由你本人粘贴，教程不包含真实值</text><text x="68" y="960.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">Resend 需有域名及通知接口额度。完全访问密钥有团队级权限；客户资源分开不代表服务商账号权限完全</text><text x="68" y="982.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">隔离。</text><line x1="48" y1="1057" x2="752" y2="1057" stroke="#dce4ed" stroke-width="1"/><text x="48" y="1080.8" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">外部 DNS 版 | cloud-mail-external-dns | main | 2026-10-29</text><text x="707" y="1079.68" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">04 / 16</text></svg>