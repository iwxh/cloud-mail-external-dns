<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><title>Cloud Mail 中文图解教程，第 6 页，示例 kinghh.cn</title><rect x="0" y="0" width="800" height="1120" fill="#f3f6fa" stroke="none" stroke-width="1"/><rect x="48" y="32" width="75.1953125" height="26" rx="7" fill="#eaf1ff" stroke="none" stroke-width="1"/><text x="58" y="47.559999999999945" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#2159bb">部署 2 / 6</text><text x="48" y="106.39999999999998" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#172b46">出现“等待审批”，点这里</text><text x="48" y="139.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#5b6c81">运行开始后打开本次运行页面；每次新建或重试，都可能需要本人审批。</text><text x="48" y="183.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">中文对照示意 · 非真实截图 · 括号内为平台原文</text><rect x="48" y="198" width="704" height="260" rx="12" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><rect x="49" y="199" width="702" height="39" rx="11" fill="#e9eef5" stroke="none" stroke-width="1"/><circle cx="66" cy="218" r="4" fill="#e38383" stroke="none" stroke-width="1"/><circle cx="82" cy="218" r="4" fill="#d8af57" stroke="none" stroke-width="1"/><circle cx="98" cy="218" r="4" fill="#70ac8a" stroke="none" stroke-width="1"/><rect x="128" y="206" width="606" height="23" rx="5" fill="#ffffff" stroke="none" stroke-width="1"/><text x="139" y="218.79999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">github.com/iwxh/cloud-mail-external-dns</text><text x="70" y="270.72" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172b46">新建客户邮箱（外部 DNS） / 运行结果</text><rect x="70" y="294" width="660" height="96" rx="7" fill="#fff3e5" stroke="none" stroke-width="1"/><text x="86" y="325.72" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#a4540d">等待审批（Waiting for review）</text><text x="86" y="356.44000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#5b6c81">本客户部署正在等待本人批准</text><rect x="526" y="321" width="184" height="38" rx="7" fill="#2159bb" stroke="none" stroke-width="1"/><text x="535.7783203125" y="342.79999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10.0" font-weight="700" fill="#ffffff">审阅部署（Review deployments）</text><rect x="522" y="317" width="192" height="46" rx="7" fill="none" stroke="#2159bb" stroke-width="2"/><circle cx="711" cy="315" r="12.5" fill="#2159bb" stroke="none" stroke-width="2"/><text x="711" y="319.25" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.0" font-weight="700" fill="#ffffff">1</text><text x="48" y="495.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">中文对照示意 · 非真实截图 · 括号内为平台原文</text><rect x="48" y="510" width="704" height="277" rx="12" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><rect x="49" y="511" width="702" height="39" rx="11" fill="#e9eef5" stroke="none" stroke-width="1"/><circle cx="66" cy="530" r="4" fill="#e38383" stroke="none" stroke-width="1"/><circle cx="82" cy="530" r="4" fill="#d8af57" stroke="none" stroke-width="1"/><circle cx="98" cy="530" r="4" fill="#70ac8a" stroke="none" stroke-width="1"/><rect x="128" y="518" width="606" height="23" rx="5" fill="#ffffff" stroke="none" stroke-width="1"/><text x="139" y="530.8" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">github.com/iwxh/cloud-mail-external-dns</text><text x="70" y="582.72" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172b46">审阅待批准的部署</text><text x="70" y="619.2" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#172b46">选择本次要批准的客户环境</text><rect x="76" y="658" width="14" height="14" rx="2" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><line x1="79" y1="665" x2="82" y2="668" stroke="#087f73" stroke-width="2"/><line x1="82" y1="668" x2="88" y2="661" stroke="#087f73" stroke-width="2"/><text x="99" y="671.8399999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#172b46">external-kinghh.cn</text><rect x="70" y="647" width="660" height="43" rx="7" fill="none" stroke="#2159bb" stroke-width="2"/><circle cx="727" cy="645" r="12.5" fill="#2159bb" stroke="none" stroke-width="2"/><text x="727" y="649.25" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.0" font-weight="700" fill="#ffffff">2</text><rect x="412" y="718" width="318" height="38" rx="7" fill="#087f73" stroke="none" stroke-width="1"/><text x="434.765869140625" y="741.7" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#ffffff">批准并部署（Approve and deploy 1）</text><rect x="408" y="714" width="326" height="46" rx="7" fill="none" stroke="#2159bb" stroke-width="2"/><circle cx="731" cy="712" r="12.5" fill="#2159bb" stroke="none" stroke-width="2"/><text x="731" y="716.25" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.0" font-weight="700" fill="#ffffff">3</text><circle cx="63" cy="833" r="13.0" fill="#2159bb" stroke="none" stroke-width="2"/><text x="63" y="837.4200000000001" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.48" font-weight="700" fill="#ffffff">1</text><text x="88" y="834.96" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#172b46">先核对，再审批</text><text x="88" y="862.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">确认仓库、客户域名和操作阶段都正确，再勾选本客户环境。只审批这一次运行。</text><rect x="48" y="933" width="704" height="92" rx="12" fill="#eaf1ff" stroke="none" stroke-width="1"/><text x="68" y="961.2" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#2159bb">找不到按钮？</text><text x="68" y="988.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">确认登录的是指定审批者账号，且当前运行仍在等待审批。不要为了跳过此页而关闭保护规则。</text><line x1="48" y1="1057" x2="752" y2="1057" stroke="#dce4ed" stroke-width="1"/><text x="48" y="1080.8" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">外部 DNS 版 | cloud-mail-external-dns | main | 2026-10-29</text><text x="707" y="1079.68" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">06 / 16</text></svg>