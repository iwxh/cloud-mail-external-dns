<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><title>Cloud Mail 中文图解教程，第 7 页，示例 kinghh.cn</title><rect x="0" y="0" width="800" height="1120" fill="#f3f6fa" stroke="none" stroke-width="1"/><rect x="48" y="32" width="75.1953125" height="26" rx="7" fill="#eaf1ff" stroke="none" stroke-width="1"/><text x="58" y="47.559999999999945" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#2159bb">部署 3 / 6</text><text x="48" y="106.39999999999998" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#172b46">检查通过后，运行 prepare</text><text x="48" y="139.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#5b6c81">同一个工作流、分支 main、同一个域名，只把 operation 改成 prepare。</text><text x="48" y="183.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">中文对照示意 · 非真实截图 · 括号内为平台原文</text><rect x="48" y="198" width="704" height="380" rx="12" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><rect x="49" y="199" width="702" height="39" rx="11" fill="#e9eef5" stroke="none" stroke-width="1"/><circle cx="66" cy="218" r="4" fill="#e38383" stroke="none" stroke-width="1"/><circle cx="82" cy="218" r="4" fill="#d8af57" stroke="none" stroke-width="1"/><circle cx="98" cy="218" r="4" fill="#70ac8a" stroke="none" stroke-width="1"/><rect x="128" y="206" width="606" height="23" rx="5" fill="#ffffff" stroke="none" stroke-width="1"/><text x="139" y="218.79999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">github.com/iwxh/cloud-mail-external-dns</text><text x="70" y="270.72" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172b46">运行（Run workflow）</text><text x="70" y="304.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">部署分支（Use workflow from）</text><rect x="70" y="316" width="660" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="82" y="338.32000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">主分支 main</text><text x="70" y="391.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">邮箱域名（domain）</text><rect x="70" y="403" width="380" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="82" y="425.32000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">kinghh.cn</text><text x="470" y="391.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">部署阶段（operation）</text><rect x="470" y="403" width="260" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="482" y="425.32000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">创建项目 / prepare</text><rect x="466" y="398" width="268" height="51" rx="7" fill="none" stroke="#2159bb" stroke-width="2"/><circle cx="731" cy="396" r="12.5" fill="#2159bb" stroke="none" stroke-width="2"/><text x="731" y="400.25" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.0" font-weight="700" fill="#ffffff">1</text><rect x="554" y="491" width="176" height="38" rx="7" fill="#087f73" stroke="none" stroke-width="1"/><text x="570.300048828125" y="513.94" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#ffffff">运行（Run workflow）</text><text x="70" y="555.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#5b6c81">按上一页审批；完成后，点击运行页顶部的短版本号 SHA，进入提交页复制完整 40 位值。</text><text x="48" y="601.68" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">中文对照示意 · 非真实截图 · 括号内为平台原文</text><rect x="48" y="616" width="704" height="244" rx="12" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><rect x="49" y="617" width="702" height="39" rx="11" fill="#e9eef5" stroke="none" stroke-width="1"/><circle cx="66" cy="636" r="4" fill="#e38383" stroke="none" stroke-width="1"/><circle cx="82" cy="636" r="4" fill="#d8af57" stroke="none" stroke-width="1"/><circle cx="98" cy="636" r="4" fill="#70ac8a" stroke="none" stroke-width="1"/><rect x="128" y="624" width="606" height="23" rx="5" fill="#ffffff" stroke="none" stroke-width="1"/><text x="139" y="636.8" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">github.com/iwxh/cloud-mail-external-dns</text><text x="70" y="688.72" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172b46">运行摘要 / 自动创建结果</text><text x="70" y="726.96" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#a4540d">当前状态：等待客户填写 DNS</text><text x="70" y="766.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">系统地址：https://本客户Worker.账号.workers.dev</text><text x="70" y="801.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">已创建：独立 Worker + D1 + KV + 收信通知接口</text><text x="70" y="835.56" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#2159bb">保存 DNS 清单、系统地址（首段即 Worker 名）及完整源码 SHA。</text><rect x="48" y="875" width="704" height="135" rx="12" fill="#fff3e5" stroke="none" stroke-width="1"/><text x="68" y="903.2" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#a4540d">看到绿色不代表邮箱已经开通</text><text x="68" y="930.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">prepare 只是程序和资源已就绪，还需要填写 DNS，再运行 finish。后续阶段完成前，不要更新 main 的</text><text x="68" y="952.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">运行代码。</text><line x1="48" y1="1057" x2="752" y2="1057" stroke="#dce4ed" stroke-width="1"/><text x="48" y="1080.8" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">外部 DNS 版 | cloud-mail-external-dns | main | 2026-10-29</text><text x="707" y="1079.68" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">07 / 16</text></svg>