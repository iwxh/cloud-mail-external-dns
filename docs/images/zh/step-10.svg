<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><title>Cloud Mail 中文图解教程，第 10 页，示例 kinghh.cn</title><rect x="0" y="0" width="800" height="1120" fill="#f3f6fa" stroke="none" stroke-width="1"/><rect x="48" y="32" width="75.1953125" height="26" rx="7" fill="#eaf1ff" stroke="none" stroke-width="1"/><text x="58" y="47.559999999999945" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#2159bb">部署 6 / 6</text><text x="48" y="106.39999999999998" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#172b46">收到激活邮件，自行设置管理员密码</text><text x="48" y="139.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#5b6c81">打开本次运行摘要里的系统地址，再进入 /setup。不是旧项目的 /api/init/。</text><text x="48" y="183.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">中文对照示意 · 非真实截图 · 括号内为平台原文</text><rect x="48" y="198" width="704" height="510" rx="12" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><rect x="49" y="199" width="702" height="39" rx="11" fill="#e9eef5" stroke="none" stroke-width="1"/><circle cx="66" cy="218" r="4" fill="#e38383" stroke="none" stroke-width="1"/><circle cx="82" cy="218" r="4" fill="#d8af57" stroke="none" stroke-width="1"/><circle cx="98" cy="218" r="4" fill="#70ac8a" stroke="none" stroke-width="1"/><rect x="128" y="206" width="606" height="23" rx="5" fill="#ffffff" stroke="none" stroke-width="1"/><text x="139" y="218.79999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">https://本客户系统地址/setup</text><text x="70" y="270.72" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172b46">激活管理员</text><text x="70" y="314.24" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="700" fill="#172b46">kinghh.cn</text><text x="70" y="348.08000000000004" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#5b6c81">admin@kinghh.cn</text><text x="70" y="395.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">激活码（Activation code）</text><rect x="70" y="407" width="660" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="82" y="429.32000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">粘贴最新邮件中的完整 64 位激活码</text><rect x="67" y="402" width="666" height="53" rx="7" fill="none" stroke="#2159bb" stroke-width="2"/><circle cx="730" cy="400" r="12.5" fill="#2159bb" stroke="none" stroke-width="2"/><text x="730" y="404.25" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.0" font-weight="700" fill="#ffffff">1</text><text x="70" y="485.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">设置密码（12-30 个字符）</text><rect x="70" y="497" width="660" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="82" y="519.32" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">••••••••••••••••••••</text><text x="70" y="575.56" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">再次输入同一个密码</text><rect x="70" y="587" width="660" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="82" y="609.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">••••••••••••••••••••</text><rect x="70" y="661" width="660" height="38" rx="7" fill="#087f73" stroke="none" stroke-width="1"/><text x="283.23828125" y="685.0799999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="700" fill="#ffffff">激活管理员（Activate admin）</text><circle cx="63" cy="755" r="13.0" fill="#2159bb" stroke="none" stroke-width="1"/><text x="63" y="759.4200000000001" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.48" font-weight="700" fill="#ffffff">1</text><text x="88" y="756.96" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#172b46">上面填激活码，下面两栏填同一个新密码</text><text x="88" y="784.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">激活码有效 24 小时。未激活时重新运行 finish 会生成新码，旧码失效，请用最新一封邮件。</text><circle cx="63" cy="866" r="13.0" fill="#2159bb" stroke="none" stroke-width="1"/><text x="63" y="870.42" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.48" font-weight="700" fill="#ffffff">2</text><text x="88" y="867.96" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#172b46">激活后去 /login 登录</text><text x="88" y="895.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">登录框已带 @kinghh.cn 后缀时，只填 admin。没有后缀时填 admin@kinghh.cn。密码由你自己输入</text><text x="88" y="917.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">。</text><text x="48" y="1003.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#087f73">已激活的项目，不再运行初始化，不重置原密码。</text><line x1="48" y1="1057" x2="752" y2="1057" stroke="#dce4ed" stroke-width="1"/><text x="48" y="1080.8" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">外部 DNS 版 | cloud-mail-external-dns | main | 2026-10-29</text><text x="707" y="1079.68" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">10 / 16</text></svg>