<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><title>Cloud Mail 中文图解教程，第 9 页，示例 kinghh.cn</title><rect x="0" y="0" width="800" height="1120" fill="#f3f6fa" stroke="none" stroke-width="1"/><rect x="48" y="32" width="75.1953125" height="26" rx="7" fill="#eaf1ff" stroke="none" stroke-width="1"/><text x="58" y="47.559999999999945" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#2159bb">部署 5 / 6</text><text x="48" y="106.39999999999998" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#172b46">DNS 生效后，运行 finish</text><text x="48" y="139.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#5b6c81">还是同一个工作流：main + kinghh.cn + finish，然后本人审批。</text><text x="48" y="183.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">中文对照示意 · 非真实截图 · 括号内为平台原文</text><rect x="48" y="198" width="704" height="380" rx="12" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><rect x="49" y="199" width="702" height="39" rx="11" fill="#e9eef5" stroke="none" stroke-width="1"/><circle cx="66" cy="218" r="4" fill="#e38383" stroke="none" stroke-width="1"/><circle cx="82" cy="218" r="4" fill="#d8af57" stroke="none" stroke-width="1"/><circle cx="98" cy="218" r="4" fill="#70ac8a" stroke="none" stroke-width="1"/><rect x="128" y="206" width="606" height="23" rx="5" fill="#ffffff" stroke="none" stroke-width="1"/><text x="139" y="218.79999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">github.com/iwxh/cloud-mail-external-dns</text><text x="70" y="270.72" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172b46">运行（Run workflow）</text><text x="70" y="304.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">部署分支（Use workflow from）</text><rect x="70" y="316" width="660" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="82" y="338.32000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">主分支 main</text><text x="70" y="391.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">邮箱域名（domain）</text><rect x="70" y="403" width="380" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="82" y="425.32000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">kinghh.cn</text><text x="470" y="391.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">部署阶段（operation）</text><rect x="470" y="403" width="260" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="482" y="425.32000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">验证并激活 / finish</text><rect x="466" y="398" width="268" height="51" rx="7" fill="none" stroke="#2159bb" stroke-width="2"/><circle cx="731" cy="396" r="12.5" fill="#2159bb" stroke="none" stroke-width="2"/><text x="731" y="400.25" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.0" font-weight="700" fill="#ffffff">1</text><rect x="554" y="492" width="176" height="38" rx="7" fill="#087f73" stroke="none" stroke-width="1"/><text x="570.300048828125" y="514.94" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#ffffff">运行（Run workflow）</text><text x="70" y="566.32" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">检查公网 DNS → 等待 Resend 认证 → 发送激活通知</text><rect x="48" y="584" width="704" height="62" rx="0" fill="#e9eef5" stroke="none" stroke-width="1"/><text x="58" y="607.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#172b46">运行结果</text><text x="358" y="607.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#172b46">下一步</text><line x1="48" y1="646" x2="752" y2="646" stroke="#dce4ed" stroke-width="1"/><rect x="48" y="646" width="704" height="62" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="58" y="669.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">激活通知已提交</text><text x="58" y="687.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">activation_email_accepted</text><text x="358" y="669.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">去通知邮箱查收激活邮件 / 垃圾箱</text><line x1="48" y1="708" x2="752" y2="708" stroke="#dce4ed" stroke-width="1"/><rect x="48" y="708" width="704" height="62" rx="0" fill="#f8fafd" stroke="none" stroke-width="1"/><text x="58" y="731.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">管理员已激活</text><text x="58" y="749.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">already_active</text><text x="358" y="731.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">直接登录，不要重复初始化</text><line x1="48" y1="770" x2="752" y2="770" stroke="#dce4ed" stroke-width="1"/><rect x="48" y="770" width="704" height="62" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="58" y="793.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">域名解析 / 认证超时</text><text x="358" y="793.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">核对解析后重试 finish，不删资源</text><line x1="48" y1="832" x2="752" y2="832" stroke="#dce4ed" stroke-width="1"/><rect x="48" y="876" width="704" height="138" rx="12" fill="#eaf1ff" stroke="none" stroke-width="1"/><text x="68" y="904.2" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#2159bb">等待与重试</text><text x="68" y="931.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">认证是异步的，流程最多等待约 20 分钟。prepare 与 finish 期间保持相同运行代码；若 main 已变更，不</text><text x="68" y="953.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">要盲目用新版重建。</text><line x1="48" y1="1057" x2="752" y2="1057" stroke="#dce4ed" stroke-width="1"/><text x="48" y="1080.8" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">外部 DNS 版 | cloud-mail-external-dns | main | 2026-10-29</text><text x="707" y="1079.68" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">09 / 16</text></svg>