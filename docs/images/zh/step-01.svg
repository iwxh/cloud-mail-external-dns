<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><title>Cloud Mail 中文图解教程，第 1 页，示例 kinghh.cn</title><rect x="0" y="0" width="800" height="1120" fill="#f3f6fa" stroke="none" stroke-width="1"/><rect x="48" y="32" width="80.0" height="26" rx="7" fill="#eaf1ff" stroke="none" stroke-width="1"/><text x="58" y="47.559999999999945" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#2159bb">先看这张图</text><text x="48" y="106.39999999999998" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#172b46">以后新客户，按这条路线部署</text><text x="48" y="139.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#5b6c81">示例 kinghh.cn 已上线，请勿重建；新客户替换为自己的域名。客户继续保留原 DNS。</text><rect x="48" y="185" width="704" height="112" rx="16" fill="#172b46" stroke="none" stroke-width="1"/><text x="72" y="229.0" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="700" fill="#ffffff">邮箱账号：admin@kinghh.cn</text><text x="72" y="267.6" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="400" fill="#d5e8ff">最终登录：https://mail.kinghh.cn</text><rect x="48" y="329" width="704" height="97" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><circle cx="82" cy="366" r="18.0" fill="#087f73" stroke="none" stroke-width="1"/><text x="82" y="372.12" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17.28" font-weight="700" fill="#ffffff">01</text><text x="117" y="361.72" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172b46">每客户一次准备</text><text x="117" y="392.32000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">新建环境，填 1 个变量 + 4 个密钥</text><rect x="622" y="347" width="60.0" height="26" rx="7" fill="#e9f6f2" stroke="none" stroke-width="1"/><text x="632" y="360.79999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="700" fill="#087f73">人工设置</text><rect x="48" y="441" width="704" height="97" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><circle cx="82" cy="478" r="18.0" fill="#087f73" stroke="none" stroke-width="1"/><text x="82" y="484.12" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17.28" font-weight="700" fill="#ffffff">02</text><text x="117" y="473.72" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172b46">部署邮箱主体</text><text x="117" y="504.32000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">plan → prepare → 客户填 DNS → finish</text><rect x="622" y="459" width="73.5693359375" height="26" rx="7" fill="#e9f6f2" stroke="none" stroke-width="1"/><text x="632" y="472.79999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="700" fill="#087f73">自动 + 审批</text><rect x="48" y="553" width="704" height="97" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><circle cx="82" cy="590" r="18.0" fill="#087f73" stroke="none" stroke-width="1"/><text x="82" y="596.12" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17.28" font-weight="700" fill="#ffffff">03</text><text x="117" y="585.72" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172b46">激活管理员</text><text x="117" y="616.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">查收激活码，自行设置密码并登录</text><rect x="622" y="571" width="60.0" height="26" rx="7" fill="#e9f6f2" stroke="none" stroke-width="1"/><text x="632" y="584.8" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="700" fill="#087f73">本人操作</text><rect x="48" y="665" width="704" height="97" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><circle cx="82" cy="702" r="18.0" fill="#087f73" stroke="none" stroke-width="1"/><text x="82" y="708.12" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17.28" font-weight="700" fill="#ffffff">04</text><text x="117" y="697.72" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172b46">接入 mail. 域名</text><text x="117" y="728.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">网站工作流 + SaaS + 客户 CNAME / TXT</text><rect x="622" y="683" width="60.0" height="26" rx="7" fill="#e9f6f2" stroke="none" stroke-width="1"/><text x="632" y="696.8" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="700" fill="#087f73">部分人工</text><rect x="48" y="777" width="704" height="97" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><circle cx="82" cy="814" r="18.0" fill="#087f73" stroke="none" stroke-width="1"/><text x="82" y="820.12" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17.28" font-weight="700" fill="#ffffff">05</text><text x="117" y="809.72" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172b46">真实收发验收</text><text x="117" y="840.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">外部邮箱来信、附件、网站发信均通过</text><rect x="622" y="795" width="60.0" height="26" rx="7" fill="#e9f6f2" stroke="none" stroke-width="1"/><text x="632" y="808.8" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="700" fill="#087f73">上线确认</text><rect x="48" y="913" width="704" height="112" rx="12" fill="#eaf1ff" stroke="none" stroke-width="1"/><text x="68" y="941.2" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#2159bb">这是一套分阶段部署流程</text><text x="68" y="968.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">程序与收发信资源可以自动创建；客户 DNS、本人审批、激活和自定义域名仍按图操作。无需切换客户的 </text><text x="68" y="990.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">NS。</text><line x1="48" y1="1057" x2="752" y2="1057" stroke="#dce4ed" stroke-width="1"/><text x="48" y="1080.8" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">外部 DNS 版 | cloud-mail-external-dns | main | 2026-10-29</text><text x="707" y="1079.68" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">01 / 16</text></svg>