<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><title>Cloud Mail 中文图解教程，第 11 页，示例 kinghh.cn</title><rect x="0" y="0" width="800" height="1120" fill="#f3f6fa" stroke="none" stroke-width="1"/><rect x="48" y="32" width="75.1953125" height="26" rx="7" fill="#eaf1ff" stroke="none" stroke-width="1"/><text x="58" y="47.559999999999945" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#2159bb">网站 1 / 4</text><text x="48" y="106.39999999999998" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#172b46">需要 mail.kinghh.cn？再运行这个</text><text x="48" y="139.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#5b6c81">“自动化 Actions”→“添加邮箱网页登录域名”。先完成管理员激活。</text><text x="48" y="183.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">中文对照示意 · 非真实截图 · 括号内为平台原文</text><rect x="48" y="198" width="704" height="493" rx="12" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><rect x="49" y="199" width="702" height="39" rx="11" fill="#e9eef5" stroke="none" stroke-width="1"/><circle cx="66" cy="218" r="4" fill="#e38383" stroke="none" stroke-width="1"/><circle cx="82" cy="218" r="4" fill="#d8af57" stroke="none" stroke-width="1"/><circle cx="98" cy="218" r="4" fill="#70ac8a" stroke="none" stroke-width="1"/><rect x="128" y="206" width="606" height="23" rx="5" fill="#ffffff" stroke="none" stroke-width="1"/><text x="139" y="218.79999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">github.com/iwxh/cloud-mail-external-dns</text><text x="70" y="270.72" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172b46">添加邮箱网页登录域名</text><text x="70" y="304.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">部署分支（Use workflow from）</text><rect x="70" y="316" width="660" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="82" y="338.32000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">主分支 main</text><text x="70" y="389.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">邮箱域名（domain）</text><rect x="70" y="401" width="660" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="82" y="423.32000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">kinghh.cn</text><text x="70" y="474.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">网页登录域名（website_hostname）</text><rect x="70" y="486" width="660" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="82" y="508.32000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">mail.kinghh.cn</text><text x="70" y="559.56" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">当前已部署的源码版本（expected_deployed_commit）</text><rect x="70" y="571" width="660" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="82" y="592.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#172b46">本客户当前已部署源码的完整 40 位 SHA</text><rect x="67" y="566" width="666" height="53" rx="7" fill="none" stroke="#2159bb" stroke-width="2"/><circle cx="730" cy="564" r="12.5" fill="#2159bb" stroke="none" stroke-width="2"/><text x="730" y="568.25" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.0" font-weight="700" fill="#ffffff">1</text><rect x="554" y="646" width="176" height="38" rx="7" fill="#087f73" stroke="none" stroke-width="1"/><text x="570.300048828125" y="668.94" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#ffffff">运行（Run workflow）</text><text x="48" y="744.2" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#2159bb">直接打开网站域名工作流</text><circle cx="63" cy="789" r="13.0" fill="#2159bb" stroke="none" stroke-width="1"/><text x="63" y="793.4200000000001" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.48" font-weight="700" fill="#ffffff">1</text><text x="88" y="790.96" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#172b46">SHA 从本客户部署记录获取</text><text x="88" y="818.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">填源码提交的 40 位 SHA，不是 CF 的版本 UUID，也不是随便复制当前 main。保存本次运行摘要，供</text><text x="88" y="840.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">下次维护使用。</text><rect x="48" y="900" width="704" height="124" rx="12" fill="#fff3e5" stroke="none" stroke-width="1"/><text x="68" y="928.2" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#a4540d">这个工作流只做程序适配</text><text x="68" y="955.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">结果“程序适配完成，等待 DNS / 证书”仍不是接入完成。程序会保留原收信回调；不要手改</text><text x="68" y="977.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">EXTERNAL_WEBSITE_HOST。</text><line x1="48" y1="1057" x2="752" y2="1057" stroke="#dce4ed" stroke-width="1"/><text x="48" y="1080.8" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">外部 DNS 版 | cloud-mail-external-dns | main | 2026-10-29</text><text x="707" y="1079.68" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">11 / 16</text></svg>