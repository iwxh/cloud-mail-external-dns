<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><title>Cloud Mail 中文图解教程，第 5 页，示例 kinghh.cn</title><rect x="0" y="0" width="800" height="1120" fill="#f3f6fa" stroke="none" stroke-width="1"/><rect x="48" y="32" width="75.1953125" height="26" rx="7" fill="#eaf1ff" stroke="none" stroke-width="1"/><text x="58" y="47.559999999999945" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#2159bb">部署 1 / 6</text><text x="48" y="106.39999999999998" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#172b46">第一次运行：先选 plan</text><text x="48" y="139.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#5b6c81">打开“自动化 Actions”→“新建客户邮箱（外部 DNS）”→“运行 Run workflow”。</text><text x="48" y="183.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">中文对照示意 · 非真实截图 · 括号内为平台原文</text><rect x="48" y="198" width="704" height="490" rx="12" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><rect x="49" y="199" width="702" height="39" rx="11" fill="#e9eef5" stroke="none" stroke-width="1"/><circle cx="66" cy="218" r="4" fill="#e38383" stroke="none" stroke-width="1"/><circle cx="82" cy="218" r="4" fill="#d8af57" stroke="none" stroke-width="1"/><circle cx="98" cy="218" r="4" fill="#70ac8a" stroke="none" stroke-width="1"/><rect x="128" y="206" width="606" height="23" rx="5" fill="#ffffff" stroke="none" stroke-width="1"/><text x="139" y="218.79999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">github.com/iwxh/cloud-mail-external-dns</text><text x="70" y="270.72" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172b46">新建客户邮箱（外部 DNS）</text><text x="70" y="304.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="400" fill="#5b6c81">手动运行，不会随代码提交自动部署客户。</text><rect x="196" y="333" width="534" height="334" rx="8" fill="#f3f6fa" stroke="#dce4ed" stroke-width="1"/><text x="216" y="362.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">部署分支（Use workflow from）</text><rect x="216" y="374" width="494" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="228" y="396.32000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">主分支 main</text><text x="216" y="448.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">邮箱域名（domain）</text><rect x="216" y="460" width="494" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="228" y="482.32000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">kinghh.cn</text><text x="216" y="534.56" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">部署阶段（operation）</text><rect x="216" y="546" width="494" height="38" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="228" y="568.32" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">只读检查 / plan</text><rect x="211" y="542" width="504" height="48" rx="7" fill="none" stroke="#2159bb" stroke-width="2"/><circle cx="712" cy="540" r="12.5" fill="#2159bb" stroke="none" stroke-width="2"/><text x="712" y="544.25" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.0" font-weight="700" fill="#ffffff">1</text><rect x="534" y="610" width="176" height="38" rx="7" fill="#087f73" stroke="none" stroke-width="1"/><text x="550.300048828125" y="632.94" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#ffffff">运行（Run workflow）</text><rect x="530" y="606" width="184" height="46" rx="7" fill="none" stroke="#2159bb" stroke-width="2"/><circle cx="711" cy="604" r="12.5" fill="#2159bb" stroke="none" stroke-width="2"/><text x="711" y="608.25" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.0" font-weight="700" fill="#ffffff">2</text><text x="70" y="735.0799999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="16" font-weight="400" fill="#2159bb">直接打开新建工作流</text><circle cx="63" cy="785" r="13.0" fill="#2159bb" stroke="none" stroke-width="2"/><text x="63" y="789.4200000000001" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.48" font-weight="700" fill="#ffffff">1</text><text x="88" y="786.96" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#172b46">只检查，不创建</text><text x="88" y="814.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">plan 会检查域名、已有 MX、资源归属和服务商冲突。它也需要通过环境审批。</text><rect x="48" y="901" width="704" height="116" rx="12" fill="#eaf1ff" stroke="none" stroke-width="1"/><text x="68" y="929.2" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#2159bb">domain 只填小写域名</text><text x="68" y="956.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">填写 kinghh.cn；不含 https://、mail. 前缀、路径、空格或 *。国际化域名先转换为 punycode。</text><line x1="48" y1="1057" x2="752" y2="1057" stroke="#dce4ed" stroke-width="1"/><text x="48" y="1080.8" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">外部 DNS 版 | cloud-mail-external-dns | main | 2026-10-29</text><text x="707" y="1079.68" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">05 / 16</text></svg>