<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><title>Cloud Mail 中文图解教程，第 12 页，示例 kinghh.cn</title><rect x="0" y="0" width="800" height="1120" fill="#f3f6fa" stroke="none" stroke-width="1"/><rect x="48" y="32" width="75.1953125" height="26" rx="7" fill="#eaf1ff" stroke="none" stroke-width="1"/><text x="58" y="47.559999999999945" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#2159bb">网站 2 / 4</text><text x="48" y="106.39999999999998" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#172b46">CF 添加客户的自定义主机名</text><text x="48" y="139.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#5b6c81">你的接入域 iwxh.cc 已启用 Cloudflare for SaaS，后续客户复用此接入能力。</text><text x="48" y="183.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">中文对照示意 · 非真实截图 · 括号内为平台原文</text><rect x="48" y="198" width="704" height="450" rx="12" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><rect x="49" y="199" width="702" height="39" rx="11" fill="#e9eef5" stroke="none" stroke-width="1"/><circle cx="66" cy="218" r="4" fill="#e38383" stroke="none" stroke-width="1"/><circle cx="82" cy="218" r="4" fill="#d8af57" stroke="none" stroke-width="1"/><circle cx="98" cy="218" r="4" fill="#70ac8a" stroke="none" stroke-width="1"/><rect x="128" y="206" width="606" height="23" rx="5" fill="#ffffff" stroke="none" stroke-width="1"/><text x="139" y="218.79999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">dash.cloudflare.com / 接入域 iwxh.cc</text><text x="70" y="270.72" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172b46">iwxh.cc / SSL-TLS / 自定义主机名</text><text x="70" y="306.32000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="700" fill="#172b46">回源地址：external-mail-origin.iwxh.cc</text><rect x="70" y="329" width="97.2265625" height="26" rx="7" fill="#e9f6f2" stroke="none" stroke-width="1"/><text x="80" y="344.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#087f73">已生效 Active</text><text x="70" y="389.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">客户网站域名（Custom hostname）</text><rect x="70" y="401" width="660" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="82" y="423.32000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">mail.kinghh.cn</text><rect x="67" y="396" width="666" height="53" rx="7" fill="none" stroke="#2159bb" stroke-width="2"/><circle cx="730" cy="394" r="12.5" fill="#2159bb" stroke="none" stroke-width="2"/><text x="730" y="398.25" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.0" font-weight="700" fill="#ffffff">1</text><text x="70" y="478.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">最低 TLS 版本</text><rect x="70" y="490" width="315" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="82" y="512.32" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">TLS 1.2</text><text x="405" y="478.55999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#5b6c81">证书验证方式</text><rect x="405" y="490" width="325" height="42" rx="6" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><text x="417" y="512.32" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">TXT</text><text x="70" y="572.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="400" fill="#5b6c81">使用托管证书 / 默认回源，保存后查看验证记录。</text><rect x="540" y="607" width="190" height="38" rx="7" fill="#087f73" stroke="none" stroke-width="1"/><text x="587.0" y="629.56" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#ffffff">添加自定义主机名</text><circle cx="63" cy="703" r="13.0" fill="#2159bb" stroke="none" stroke-width="1"/><text x="63" y="707.4200000000001" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.48" font-weight="700" fill="#ffffff">1</text><text x="88" y="704.96" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#172b46">一位客户，一个精确主机名</text><text x="88" y="732.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">只添加 mail.kinghh.cn，不添加通配符。请保存 CF 返回的域名归属 TXT 和证书验证 TXT。</text><circle cx="63" cy="809" r="13.0" fill="#2159bb" stroke="none" stroke-width="1"/><text x="63" y="813.4200000000001" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.48" font-weight="700" fill="#ffffff">2</text><text x="88" y="810.96" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#172b46">接入域底座只设置一次</text><text x="88" y="838.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">当前接入目标是 external-mail-origin.iwxh.cc。新客户不要重新开启套餐或改掉 回源地址；此地址也不</text><text x="88" y="860.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">是邮件 MX。</text><rect x="48" y="921" width="704" height="104" rx="12" fill="#eaf1ff" stroke="none" stroke-width="1"/><text x="68" y="949.2" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#2159bb">费用与额度</text><text x="68" y="976.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">SaaS 已在当前账号启用；新增客户仍受现有套餐、主机名额度和超额计费规则约束。不是无限免费。</text><line x1="48" y1="1057" x2="752" y2="1057" stroke="#dce4ed" stroke-width="1"/><text x="48" y="1080.8" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">外部 DNS 版 | cloud-mail-external-dns | main | 2026-10-29</text><text x="707" y="1079.68" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">12 / 16</text></svg>