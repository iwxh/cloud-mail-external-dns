<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><title>Cloud Mail 中文图解教程，第 2 页，示例 kinghh.cn</title><rect x="0" y="0" width="800" height="1120" fill="#f3f6fa" stroke="none" stroke-width="1"/><rect x="48" y="32" width="75.1953125" height="26" rx="7" fill="#eaf1ff" stroke="none" stroke-width="1"/><text x="58" y="47.559999999999945" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#2159bb">准备 1 / 3</text><text x="48" y="106.39999999999998" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#172b46">先确认域名与仓库</text><text x="48" y="139.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#5b6c81">本手册使用 kinghh.cn 举例。每次只替换为当前客户自己的邮箱域名。</text><rect x="48" y="191" width="704" height="51" rx="0" fill="#e9eef5" stroke="none" stroke-width="1"/><text x="58" y="216.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#172b46">项目</text><text x="268" y="216.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#172b46">本教程填写示例</text><line x1="48" y1="242" x2="752" y2="242" stroke="#dce4ed" stroke-width="1"/><rect x="48" y="242" width="704" height="51" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="58" y="267.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#172b46">邮箱后缀</text><text x="268" y="267.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#172b46">@kinghh.cn</text><line x1="48" y1="293" x2="752" y2="293" stroke="#dce4ed" stroke-width="1"/><rect x="48" y="293" width="704" height="51" rx="0" fill="#f8fafd" stroke="none" stroke-width="1"/><text x="58" y="318.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#172b46">管理员</text><text x="268" y="318.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#172b46">admin@kinghh.cn</text><line x1="48" y1="344" x2="752" y2="344" stroke="#dce4ed" stroke-width="1"/><rect x="48" y="344" width="704" height="51" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="58" y="369.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#172b46">网页登录地址</text><text x="268" y="369.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#172b46">mail.kinghh.cn</text><line x1="48" y1="395" x2="752" y2="395" stroke="#dce4ed" stroke-width="1"/><rect x="48" y="395" width="704" height="51" rx="0" fill="#f8fafd" stroke="none" stroke-width="1"/><text x="58" y="420.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#172b46">GitHub 客户环境</text><text x="268" y="420.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#172b46">external-kinghh.cn</text><line x1="48" y1="446" x2="752" y2="446" stroke="#dce4ed" stroke-width="1"/><rect x="48" y="446" width="704" height="51" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="58" y="471.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#172b46">部署分支</text><text x="268" y="471.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#172b46">main</text><line x1="48" y1="497" x2="752" y2="497" stroke="#dce4ed" stroke-width="1"/><rect x="48" y="528" width="704" height="134" rx="12" fill="#ffffff" stroke="none" stroke-width="1"/><text x="70" y="565.84" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="700" fill="#172b46">使用这个独立仓库</text><text x="70" y="603.84" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="400" fill="#2159bb">iwxh / cloud-mail-external-dns</text><text x="70" y="638.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">客户不用把根域或 NS 转到 Cloudflare。</text><circle cx="63" cy="711" r="13.0" fill="#2159bb" stroke="none" stroke-width="1"/><text x="63" y="715.4200000000001" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.48" font-weight="700" fill="#ffffff">1</text><text x="88" y="712.96" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#172b46">先看客户是否已有邮箱</text><text x="88" y="740.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">若根域已有 MX，先确定迁移方案。不要把两家 MX 混填成按用户名分流。</text><circle cx="63" cy="811" r="13.0" fill="#2159bb" stroke="none" stroke-width="1"/><text x="63" y="815.4200000000001" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.48" font-weight="700" fill="#ffffff">2</text><text x="88" y="812.96" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#172b46">保留原网站解析</text><text x="88" y="840.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">现有 A、AAAA、CNAME 和 NS 保留。邮件记录只按本次部署摘要处理。</text><rect x="48" y="913" width="704" height="112" rx="12" fill="#fff3e5" stroke="none" stroke-width="1"/><text x="68" y="941.2" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#a4540d">别选错旧仓库</text><text x="68" y="968.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">cloud-mail 是原来的 CF 托管 DNS 版；当前客户保留 DNS 的部署，请使用 cloud-mail-external-dns。</text><line x1="48" y1="1057" x2="752" y2="1057" stroke="#dce4ed" stroke-width="1"/><text x="48" y="1080.8" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">外部 DNS 版 | cloud-mail-external-dns | main | 2026-10-29</text><text x="707" y="1079.68" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">02 / 16</text></svg>