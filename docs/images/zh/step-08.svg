<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120"><title>Cloud Mail 中文图解教程，第 8 页，示例 kinghh.cn</title><rect x="0" y="0" width="800" height="1120" fill="#f3f6fa" stroke="none" stroke-width="1"/><rect x="48" y="32" width="75.1953125" height="26" rx="7" fill="#eaf1ff" stroke="none" stroke-width="1"/><text x="58" y="47.559999999999945" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12" font-weight="700" fill="#2159bb">部署 4 / 6</text><text x="48" y="106.39999999999998" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#172b46">把运行摘要中的邮件 DNS 交给客户</text><text x="48" y="139.20000000000005" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="400" fill="#5b6c81">在客户原来的 DNS 平台添加。无需更换 NS，也不需要把根域接入 CF。</text><text x="48" y="183.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">中文对照示意 · 非真实截图 · 括号内为平台原文</text><rect x="48" y="198" width="704" height="414" rx="12" fill="#ffffff" stroke="#dce4ed" stroke-width="1"/><rect x="49" y="199" width="702" height="39" rx="11" fill="#e9eef5" stroke="none" stroke-width="1"/><circle cx="66" cy="218" r="4" fill="#e38383" stroke="none" stroke-width="1"/><circle cx="82" cy="218" r="4" fill="#d8af57" stroke="none" stroke-width="1"/><circle cx="98" cy="218" r="4" fill="#70ac8a" stroke="none" stroke-width="1"/><rect x="128" y="206" width="606" height="23" rx="5" fill="#ffffff" stroke="none" stroke-width="1"/><text x="139" y="218.79999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">客户原 DNS 服务商</text><text x="70" y="270.72" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="19" font-weight="700" fill="#172b46">客户 DNS 平台 / 添加记录</text><rect x="70" y="294" width="660" height="54" rx="0" fill="#e9eef5" stroke="none" stroke-width="1"/><text x="80" y="315.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="700" fill="#172b46">类型</text><text x="160" y="315.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="700" fill="#172b46">主机记录</text><text x="360" y="315.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="700" fill="#172b46">记录值</text><text x="660" y="315.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="700" fill="#172b46">优先级</text><line x1="70" y1="348" x2="730" y2="348" stroke="#dce4ed" stroke-width="1"/><rect x="70" y="348" width="660" height="54" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="80" y="369.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#172b46">MX</text><text x="160" y="369.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#172b46">@</text><text x="360" y="369.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#172b46">本次摘要的收信 MX</text><text x="660" y="369.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#172b46">按摘要</text><line x1="70" y1="402" x2="730" y2="402" stroke="#dce4ed" stroke-width="1"/><rect x="70" y="402" width="660" height="54" rx="0" fill="#f8fafd" stroke="none" stroke-width="1"/><text x="80" y="423.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#172b46">TXT</text><text x="160" y="423.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#172b46">实际 DKIM 选择器</text><text x="360" y="423.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#172b46">本次摘要的 DKIM 公钥</text><text x="660" y="423.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#172b46">-</text><line x1="70" y1="456" x2="730" y2="456" stroke="#dce4ed" stroke-width="1"/><rect x="70" y="456" width="660" height="54" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/><text x="80" y="477.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#172b46">TXT</text><text x="160" y="477.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#172b46">摘要中的发信主机</text><text x="360" y="477.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#172b46">本次摘要的 SPF 内容</text><text x="660" y="477.67999999999995" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#172b46">-</text><line x1="70" y1="510" x2="730" y2="510" stroke="#dce4ed" stroke-width="1"/><rect x="70" y="510" width="660" height="54" rx="0" fill="#f8fafd" stroke="none" stroke-width="1"/><text x="80" y="531.68" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#172b46">MX</text><text x="160" y="531.68" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#172b46">摘要中的发信主机</text><text x="360" y="531.68" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#172b46">本次摘要的反馈 MX</text><text x="660" y="531.68" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#172b46">按摘要</text><line x1="70" y1="564" x2="730" y2="564" stroke="#dce4ed" stroke-width="1"/><text x="70" y="601.44" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="13" font-weight="700" fill="#a4540d">以上只是字段示意，不是可直接复制的 DNS 配置。</text><circle cx="63" cy="663" r="13.0" fill="#2159bb" stroke="none" stroke-width="1"/><text x="63" y="667.4200000000001" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.48" font-weight="700" fill="#ffffff">1</text><text x="88" y="664.96" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#172b46">根域收信，MX 主机记录填 @</text><text x="88" y="692.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">邮箱后缀是 @kinghh.cn 时，收信 MX 放根域。不要因为网页叫 mail.kinghh.cn 就把 MX 填到 mail。</text><circle cx="63" cy="771" r="13.0" fill="#2159bb" stroke="none" stroke-width="1"/><text x="63" y="775.4200000000001" text-anchor="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="12.48" font-weight="700" fill="#ffffff">2</text><text x="88" y="772.96" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="17" font-weight="700" fill="#172b46">记录值以本次摘要为准</text><text x="88" y="800.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">不同域名或服务商版本可能返回不同值。下一位客户不要复制本示例的 DKIM 或验证值；请用本次运行</text><text x="88" y="822.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#5b6c81">实际返回的记录。</text><rect x="48" y="901" width="704" height="121" rx="12" fill="#fff3e5" stroke="none" stroke-width="1"/><text x="68" y="929.2" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="700" fill="#a4540d">添加前核对现有记录</text><text x="68" y="956.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">保留原网站 A / AAAA / CNAME 和 NS。遇到旧 MX、同名记录冲突或已有 SPF，先处理迁移或合并，不</text><text x="68" y="978.3199999999999" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="14" font-weight="400" fill="#172b46">能盲目覆盖。</text><line x1="48" y1="1057" x2="752" y2="1057" stroke="#dce4ed" stroke-width="1"/><text x="48" y="1080.8" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="10" font-weight="400" fill="#5b6c81">外部 DNS 版 | cloud-mail-external-dns | main | 2026-10-29</text><text x="707" y="1079.68" text-anchor="start" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="11" font-weight="400" fill="#5b6c81">08 / 16</text></svg>